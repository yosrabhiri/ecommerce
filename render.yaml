services:
  - type: web
    name: maison-glow-api
    runtime: docker
    plan: free
    branch: useraccount
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: Maison Glow
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: maison-glow-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: maison-glow-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log
      - key: RUN_SEEDER
        value: true

  - type: web
    name: maison-glow
    runtime: static
    branch: useraccount
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: maison-glow-db
    plan: free
    databaseName: maison_glow
    user: maison_glow
